upstream api_backend {
    server api:8000;
}

upstream vinted_browser {
    server browser:7900;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reference image uploads are a few MB each, but /api/data/import accepts
    # full-state backups up to the backend's MAX_BACKUP_UPLOAD_BYTES (1GB).
    client_max_body_size 1024m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Public Telegram webhook — must stay unauthenticated so Telegram can reach it.
    # Only POST bypasses auth; GET (used by the Settings page's status widget)
    # and any other method still require basic-auth like the rest of /api/.
    location = /api/telegram/webhook {
        limit_except POST {
            auth_basic "vsniper";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }
        proxy_pass http://api_backend;
    }

    # Health check — test this nginx service itself. The API has its own Docker
    # healthcheck; coupling web health to it makes Traefik remove the entire SPA
    # during an API delay instead of returning a useful API error to the client.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"service":"vsniper-web","status":"ok"}';
    }

    # Operator-only visible Chromium session used to complete Vinted browser
    # challenges. Selenium/noVNC ports stay private to the Docker network.
    location /vinted-browser/ {
        auth_basic "vsniper";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_pass http://vinted_browser/;
    }

    # Taste recompute runs the describe-images + build-profile pipeline synchronously
    # in the request handler and can take minutes; the default 60s proxy_read_timeout
    # 504s long before the backend (which itself allows up to 300s per AI call) replies.
    location = /api/taste/recompute {
        auth_basic "vsniper";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://api_backend;
    }

    # Taste snapshots can be hundreds of KB. Stream the response instead of
    # spilling nginx's small default proxy buffers to a temporary file.
    location = /api/taste {
        auth_basic "vsniper";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_buffering off;
        proxy_pass http://api_backend;
    }

    # Protected REST API. Everything here leaks secrets / allows writes, so it
    # sits behind basic-auth (the bug we are fixing: never expose this raw).
    location /api/ {
        auth_basic "vsniper";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://api_backend;
    }

    # Protected SPA shell.
    location / {
        auth_basic "vsniper";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /index.html;
    }
}
