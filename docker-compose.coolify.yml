# Production stack for Coolify.
#
# Differences from docker-compose.yml (local dev):
#   - No bundled Traefik. Coolify's own proxy terminates TLS and routes the
#     domain you assign to the `web` service.
#   - No host port mappings. Only Coolify's proxy talks to the containers.
#   - `web` serves a built bundle via nginx (web/Dockerfile.prod) instead of the
#     Vite dev server, and reverse-proxies /api to the backend. nginx enforces
#     basic-auth on the dashboard and /api while leaving /api/telegram/webhook
#     and /healthz public.
#   - Source is baked into the images (no live-reload bind mounts); only the
#     persistent `storage` volume is mounted.
#
# KEEP IN SYNC: the api/worker `build` context and healthchecks are duplicated
# from docker-compose.yml. Change both when you touch either.
#
# Setup in Coolify:
#   1. New Resource -> Docker Compose, point at docker-compose.coolify.yml.
#   2. Set environment variables in the Coolify UI (Coolify injects them into
#      every service). At minimum: BASIC_AUTH_USERS plus everything from
#      .env.example. Generate BASIC_AUTH_USERS with scripts/generate_auth.py.
#   3. Assign your domain to the `web` service (container port 80).
#   4. Point TELEGRAM_WEBHOOK_URL at https://<your-domain>/api/telegram/webhook.
#   5. Replace the Coolify resource UUID in the `web` service's
#      `traefik.http.routers.*` labels with the new resource's UUID, or the
#      active Traefik healthcheck stays inert.
#
# `api`/`worker` also join the shared external `coolify` network so
# LOCAL_VLM_BASE_URL can reach other Coolify-managed services by container
# alias (e.g. http://lfm25-vl:8080/v1) instead of only host.docker.internal.

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/app/storage
    networks:
      - app
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/app/storage
    networks:
      - app
      - coolify
    command: python -m vsniper.worker.scheduler
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib, sys; sys.exit(0 if any('vsniper.worker.scheduler' in p.joinpath('cmdline').read_text(errors='ignore').replace('\\0', ' ') for p in pathlib.Path('/proc').iterdir() if p.name.isdigit()) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      BASIC_AUTH_USERS: ${BASIC_AUTH_USERS}
    expose:
      - "80"
    networks:
      - app
    # Active Traefik healthcheck: probe /healthz over the real docker network so
    # a stale backend endpoint is evicted instead of hanging until a 504 (the
    # container-level healthcheck below only tests loopback and can't catch
    # that). Coolify's generated routers are named after the resource UUID, so
    # the two `.service=` overrides are pinned to THIS Coolify resource
    # (ny7hl8gp7n9f3excayygzj0l). On a fresh Coolify resource these labels are
    # inert until the UUID is updated to the new resource's.
    labels:
      - "traefik.http.services.vsniper-web.loadbalancer.server.port=80"
      - "traefik.http.services.vsniper-web.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.vsniper-web.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.vsniper-web.loadbalancer.healthcheck.timeout=3s"
      - "traefik.http.routers.http-0-ny7hl8gp7n9f3excayygzj0l-web.service=vsniper-web"
      - "traefik.http.routers.https-0-ny7hl8gp7n9f3excayygzj0l-web.service=vsniper-web"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  storage:

networks:
  app:
  coolify:
    external: true
